<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Wedding Countdown</title>
<style>
  body {
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    background: #f5f5f5;
  }
  #countdown {
    font-size: 2.5rem;
    font-weight: bold;
    color: #333;
  }
</style>
</head>
<body>
<div id="countdown"></div>
<script>
/*
 * Simple wedding countdown timer for May 2, 2026.
 * Calculates the number of days left and updates every hour.
 */
const weddingDate = new Date("May 2, 2026 00:00:00");
function updateCountdown() {
  const now = new Date();
  const diff = weddingDate - now;
  const days = Math.max(0, Math.ceil(diff / (1000 * 60 * 60 * 24)));
  document.getElementById("countdown").textContent = days + (days === 1 ? " Day" : " Days") + " Left";
}
updateCountdown();
// Update every hour
setInterval(updateCountdown, 60 * 60 * 1000);
</script>
</body>
</html>
